[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-ops-runbook"
version = "0.1.0"
description = "PRIVATE ops runbook: recovery commands Stephen actually uses (PowerShell 5.1), searchable site, Find-Fix, weekday unblocker board generator. Fixes one search away."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Stephen Lutar", email = "stephen@szlholdings.com" }]
dependencies = []

[project.urls]
Homepage = "https://a-11-oy.com"
Repository = "https://github.com/szl-holdings/szl-ops-runbook"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", "node_modules"]

[tool.ruff.lint]
# Baseline: syntax errors, undefined names, misuse of f-strings. Tighten per repo once green.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"
