# .github/workflows/ci.yml — estate baseline CI (added 2026-11-06)
# ruff (baseline rules) + pytest on Python 3.11/3.12. Actions pinned by SHA (org convention).
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip ruff pytest
          python -m pip install -e . || true
      - name: Lint (ruff baseline)
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
