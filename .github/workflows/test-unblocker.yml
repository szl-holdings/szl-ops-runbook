name: Unblocker readiness contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline readiness contracts
        run: |
          python -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_unblocker*.py')
          if suite.countTestCases() == 0:
              raise SystemExit('No readiness tests discovered')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun == len(result.skipped):
              raise SystemExit(1)
          PY
